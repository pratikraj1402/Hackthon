<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Registration</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">HealthAssist</div>
    <nav>
        <a href="index.html">Home</a>
        <a href="register.html">Registration</a>
        <a href="documents.html">Documents</a>
        <a href="doctor.html">Doctor Dashboard</a>
    </nav>
</header>

<div class="container">
    <div class="form-card">
        <h1>Patient Registration</h1>
        <p class="form-description">Enter your basic information.</p>

        <form id="registrationForm">
            <label>Full Name</label>
            <input type="text" id="name" placeholder="Enter your full name" required>

            <label>Age</label>
            <input type="number" id="age" placeholder="Enter your age" min="1" max="120" required>

            <label>Gender</label>
            <select id="gender" required>
                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>

            <label>Mobile Number</label>
            <input type="tel" id="mobile" placeholder="Enter mobile number" maxlength="10" required>

            <label>ABHA ID (Optional)</label>
            <input type="text" id="abha" placeholder="Enter ABHA ID">

            <label>Preferred Language</label>
            <select id="language" required>
                <option value="">Select Language</option>
                <option value="English">English</option>
                <option value="Hindi">Hindi</option>
            </select>

            <button type="submit" class="btn">Continue</button>
        </form>
    </div>
</div>

<footer>
    <p>© 2026 HealthAssist</p>
</footer>

<script src="script.js"></script>

</body>
</html>
